<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grill 作答</title>
<!--
  数据区：每轮只替换下面 <script id="data"> 里的 JSON，页面其余部分不动。
  格式：
  {
    "round": 1,
    "questions": [
      {
        "id": "Q1",
        "title": "问题标题",
        "body": "终端里的问题正文原文，不含选项",
        "options": [{ "key": "A", "text": "终端里的选项 A 原文" }, { "key": "B", "text": "终端里的选项 B 原文" }],
        "recommend": "B",
        "reason": "终端里的推荐理由原文"
      }
    ]
  }
  无选项的问题：options 设为 []，recommend 写推荐答案原文。
-->
<script id="data" type="application/json">
{
  "round": 1,
  "questions": [
    {
      "id": "Q1",
      "title": "示例：目标平台",
      "body": "转盘主要在哪用？",
      "options": [
        { "key": "A", "text": "只做手机端" },
        { "key": "B", "text": "手机优先，电脑也能用" },
        { "key": "C", "text": "只做电脑端" }
      ],
      "recommend": "B",
      "reason": "响应式成本低，覆盖面广"
    },
    {
      "id": "Q2",
      "title": "示例：奖品数量上限",
      "body": "奖品最多允许设置几个？",
      "options": [],
      "recommend": "2～12 个，超过后扇区太窄看不清"
    }
  ]
}
</script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d1f23; --muted: #6b7078;
    --line: #e3e5e8; --accent: #2f6fed; --accent-soft: #eaf1ff; --ok: #1f9d55;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1e2125; --text: #e7e9ec; --muted: #9aa0a8;
      --line: #2e3238; --accent: #6b9bff; --accent-soft: #1f2a40; --ok: #3ccf7f;
      --warn: #f5a524;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow-wrap: anywhere;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .q h2 { font-size: 17px; margin: 0 0 8px; }
  .q h2 .id { color: var(--accent); margin-right: 6px; }
  .body { white-space: pre-wrap; margin: 0 0 10px; }
  .rec { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; padding: 8px 12px; margin: 12px 0 4px; white-space: pre-wrap; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: 6px 0;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  label.opt:hover { border-color: var(--accent); }
  label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  label.opt input { margin-top: 5px; flex: none; accent-color: var(--accent); }
  label.opt b { margin-right: 6px; }
  .chg { display: none; font-size: 12px; font-weight: 500; color: var(--warn); margin-left: 8px; }
  .q.changed .chg { display: inline-block; }
  #diff { color: var(--muted); font-size: 13px; }
  #diff.warn { color: var(--warn); font-weight: 600; }
  .tag { font-size: 12px; color: var(--accent); margin-left: 4px; }
  textarea {
    width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; resize: vertical; min-height: 38px;
  }
  .custom { display: none; }
  .custom.show { display: block; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px;
  }
  .bar { max-width: 1000px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #status { color: var(--ok); font-size: 13px; }
  #preview { display: none; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace;
    background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">默认已选推荐项。改完点底部「复制答案」，粘贴回终端即可。</p>
  <div id="list"></div>
  <pre id="preview"></pre>
</main>
<footer><div class="bar"><button id="copy">复制答案</button><span id="diff"></span><span id="status"></span></div></footer>

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const list = document.getElementById('list');
document.getElementById('title').textContent = `第 ${data.round} 轮问题`;
document.title = `Grill 第 ${data.round} 轮`;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

data.questions.forEach((q, i) => {
  const box = el('section', 'q');
  const h = el('h2');
  h.append(el('span', 'id', q.id), q.title, el('span', 'chg', '已修改'));
  box.append(h);
  if (q.body) box.append(el('p', 'body', q.body));

  const hasOpts = q.options && q.options.length;
  const recText = hasOpts
    ? `➡️ 推荐 ${q.recommend}${q.reason ? '：' + q.reason : ''}`
    : `➡️ 推荐：${q.recommend}`;

  const name = 'q' + i;
  const choices = hasOpts
    ? q.options.map(o => ({ value: o.key, key: o.key, label: o.text, rec: o.key === q.recommend }))
    : [{ value: '__rec', label: '按推荐', rec: true }];
  choices.push({ value: '__custom', label: '其他（自己写）', rec: false });

  const custom = el('textarea', 'custom');
  custom.placeholder = '写下你的答案';
  choices.forEach(c => {
    const lab = el('label', 'opt');
    const r = document.createElement('input');
    r.type = 'radio'; r.name = name; r.value = c.value; r.checked = c.rec;
    r.addEventListener('change', () => { custom.classList.toggle('show', r.value === '__custom'); refresh(); });
    const span = el('span');
    if (c.key) span.append(el('b', null, c.key));
    span.append(c.label);
    lab.append(r, span);
    if (c.rec) span.append(el('span', 'tag', '推荐'));
    box.append(lab);
  });
  box.append(custom);
  box.append(el('div', 'rec', recText));

  const note = el('textarea');
  note.placeholder = '补充说明（可选）';
  box.append(note);

  const recValue = choices.find(c => c.rec).value;
  q._changed = () => box.querySelector(`input[name="${name}"]:checked`)?.value !== recValue;
  q._box = box;
  q._get = () => {
    const v = box.querySelector(`input[name="${name}"]:checked`)?.value;
    let ans;
    if (v === '__custom') ans = '自定义：' + (custom.value.trim() || '（未填写）');
    else if (v === '__rec') ans = '按推荐';
    else if (v === q.recommend) ans = `按推荐（${v}）`;
    else ans = v || '（未选择）';
    const n = note.value.trim();
    return `${q.id}：${ans}${n ? '（补充：' + n + '）' : ''}`;
  };
  list.append(box);
});

function refresh() {
  let n = 0;
  data.questions.forEach(q => { const c = q._changed(); q._box.classList.toggle('changed', c); if (c) n++; });
  const d = document.getElementById('diff');
  d.textContent = n ? `${n} 题偏离推荐` : '全部按推荐';
  d.classList.toggle('warn', n > 0);
}
refresh();

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const t = document.createElement('textarea');
  t.value = text; document.body.append(t); t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  t.remove();
  return ok;
}

document.getElementById('copy').addEventListener('click', async () => {
  const text = `第 ${data.round} 轮回答：\n` + data.questions.map(q => q._get()).join('\n');
  const pre = document.getElementById('preview');
  pre.textContent = text; pre.style.display = 'block';
  const ok = await copyText(text);
  document.getElementById('status').textContent = ok ? '已复制，粘贴回终端即可' : '复制失败，请手动复制下方文本';
});
</script>
</body>
</html>
